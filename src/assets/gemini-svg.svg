<!-- Agrega este bloque dentro de tu <svg> principal en sprite.svg -->
<symbol id="icon-intellect" viewBox="0 0 512 512">
  <defs>
    <!-- Gradientes con IDs únicos para evitar colisiones en el sprite -->
    <linearGradient id="intellect-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="intellect-primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="intellect-bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="intellect-flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="intellect-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado opcional (puedes quitar este <rect> si solo quieres el icono transparente) -->
  <rect width="512" height="512" rx="112" fill="url(#intellect-bgGrad)" />

  <g transform="translate(0, 8)">
    <!-- Hoja izquierda -->
    <path d="M 128 340 C 170 320, 220 330, 256 350 C 256 220, 256 180, 256 180 C 210 165, 160 155, 128 175 Z" 
          fill="url(#intellect-bookGrad)" opacity="0.9" />

    <!-- Hoja derecha -->
    <path d="M 384 340 C 342 320, 292 330, 256 350 C 256 220, 256 180, 256 180 C 302 165, 352 155, 384 175 Z" 
          fill="url(#intellect-primaryGrad)" />

    <!-- Base / Antorcha -->
    <path d="M 242 360 L 270 360 L 264 250 L 248 250 Z" fill="#FFFFFF" />

    <!-- Llama principal -->
    <path d="M 256 100 C 275 140, 305 160, 285 210 C 275 235, 250 250, 256 270 C 230 250, 220 220, 230 195 C 240 170, 225 150, 256 100 Z" 
          fill="url(#intellect-flameGrad)" filter="url(#intellect-glow)" />

    <!-- Detalle interno llama -->
    <path d="M 256 160 C 265 185, 275 195, 260 225 C 248 210, 248 195, 256 160 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Puntos circulares -->
    <circle cx="256" cy="90" r="12" fill="#34D399" />
    <circle cx="340" cy="140" r="8" fill="#06B6D4" />
    <circle cx="172" cy="140" r="8" fill="#3B82F6" />
  </g>
</symbol>
